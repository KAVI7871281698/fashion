{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Successful</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
/* ================= THEME ================= */
:root {
  --white: #ffffff;
  --sky-soft: #f2f9ff;
  --sky-light: #e6f3ff;

  --fire-red: #e50914;
  --success-green: #28a745;

  --dark-text: #111111;
  --soft-gray: #666666;

  --border-light: rgba(0, 0, 0, 0.12);
  --card-shadow: 0 14px 28px rgba(0, 0, 0, 0.08);
}

/* ================= BODY ================= */
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(
    180deg,
    var(--white) 0%,
    var(--sky-soft) 60%,
    var(--sky-light) 100%
  );
}

/* ================= CONTAINER ================= */
.success-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ================= CARD ================= */
.success-card {
  background: var(--white);
  padding: 50px 40px;
  border-radius: 18px;
  text-align: center;
  box-shadow: var(--card-shadow);
  max-width: 420px;
  width: 100%;
  border: 1px solid var(--border-light);
}

/* ================= ICON ================= */
.success-icon {
  font-size: 64px;
  color: var(--success-green);
  margin-bottom: 15px;
}

/* ================= TEXT ================= */
.success-card h1 {
  font-size: 26px;
  margin-bottom: 10px;
  color: var(--dark-text);
}

.success-card p {
  color: var(--soft-gray);
  font-size: 14px;
  margin-bottom: 30px;
  line-height: 1.6;
}

/* ================= ACTION BUTTONS ================= */
.success-actions a {
  display: inline-block;
  padding: 12px 26px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 500;
  margin: 0 6px;
  font-size: 14px;
  transition: all 0.3s ease;
}

/* Home Button */
.btn-home {
  background: var(--fire-red);
  color: #ffffff;
  border: none;
}

.btn-home:hover {
  background: #b20710;
  box-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
}

/* Cart Button */
.btn-cart {
  border: 1px solid var(--border-light);
  color: var(--dark-text);
  background: transparent;
}

.btn-cart:hover {
  background: var(--sky-soft);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 480px) {
  .success-card {
    padding: 40px 25px;
  }

  .success-actions a {
    display: block;
    margin: 8px 0;
  }
}

</style>
</head>

<body>

<div class="success-container">
    <div class="success-card">
        <div class="success-icon">✅</div>

        <h1>Order Placed Successfully!</h1>
        <p>
            Thank you for your order.  
            Your items will be delivered as per the selected date.
        </p>

        <div class="success-actions">
            <a href="{% url 'index' %}" class="btn-home">🏠 Go to Home</a>
            <a href="{% url 'view_cart' %}" class="btn-cart">🛒 View Cart</a>
        </div>
    </div>
</div>

</body>
</html>
