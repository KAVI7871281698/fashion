{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Infinite Cinephile</title>

    <!-- Mobile responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- ================= INTERNAL CSS ================= -->
<style>
:root {
  --white: #ffffff;
  --sky-soft: #f2f9ff;
  --sky-light: #e6f3ff;

  --fire-red: #e50914;
  --accent-blue: #2563eb;

  --dark-text: #111111;
  --soft-gray: #666666;

  --border-light: rgba(0, 0, 0, 0.12);
  --card-shadow: 0 18px 40px rgba(0, 0, 0, 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html, body {
  height: 100%;
}

/* ================= CONTAINER ================= */
.auth-container {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    180deg,
    var(--white) 0%,
    var(--sky-soft) 55%,
    var(--sky-light) 100%
  );
  overflow: hidden;
}

/* Soft decorative background */
.auth-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at top right,
    rgba(37, 99, 235, 0.12),
    transparent 60%
  );
}

/* ================= CARD ================= */
.auth-card {
  z-index: 2;
  width: 90%;
  max-width: 420px;
  background: var(--white);
  padding: 32px 26px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid var(--border-light);
  box-shadow: var(--card-shadow);
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from {
    transform: translateY(25px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* ================= TITLE ================= */
.auth-card h2 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 18px;
  color: var(--fire-red);
}

/* ================= ALERT ================= */
.alert {
  background: rgba(229, 9, 20, 0.08);
  color: var(--fire-red);
  padding: 8px;
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 12px;
  border: 1px solid rgba(229, 9, 20, 0.25);
}

/* ================= INPUT ================= */
.input-group {
  position: relative;
  margin-bottom: 14px;
}

.input-group i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: var(--soft-gray);
}

.input-group input {
  width: 100%;
  padding: 12px 40px;
  background: var(--white);
  border-radius: 8px;
  border: 1px solid var(--border-light);
  outline: none;
  font-size: 15px;
  color: var(--dark-text);
}

.input-group input::placeholder {
  color: #999;
}

.input-group input:focus {
  border-color: var(--fire-red);
  box-shadow: 0 0 8px rgba(229, 9, 20, 0.35);
}

/* ================= BUTTON ================= */
button {
  width: 100%;
  padding: 12px;
  background: linear-gradient(
    135deg,
    var(--fire-red),
    #b20710
  );
  color: #ffffff;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.3s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 14px rgba(229, 9, 20, 0.45);
}

/* ================= BOTTOM TEXT ================= */
.switch-text {
  margin-top: 14px;
  font-size: 14px;
  color: var(--soft-gray);
}

.switch-text a {
  color: var(--fire-red);
  font-weight: 600;
  text-decoration: none;
}

.switch-text a:hover {
  text-decoration: underline;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 576px) {
  .auth-card {
    padding: 24px 18px;
    border-radius: 16px;
  }

  .auth-card h2 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="auth-container">

    <div class="auth-card">
        <h2>Welcome Back</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="/login">
            {% csrf_token %}

            <div class="input-group">
                <i class='bx bx-mail-send'></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="switch-text">
            Don’t have an account?
            <a href="/register">Create one</a>
        </p>
    </div>

</div>

</body>
</html>
