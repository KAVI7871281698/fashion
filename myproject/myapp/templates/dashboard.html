{% extends "dashboard_base.html" %}

{% block content %}

<h1>Admin Dashboard</h1>

<div class="cards">

  <div class="card">
    <h3>Total Orders</h3>
    <p>{{ total_orders }}</p>
  </div>

  <div class="card">
    <h3>Total Users</h3>
    <p>{{ total_users }}</p>
  </div>

  <div class="card">
    <h3>Total Products</h3>
    <p>{{ total_products }}</p>
  </div>

  <div class="card">
    <h3>Total Revenue</h3>
    <p>₹{{ total_revenue }}</p>
  </div>

</div>

<style>
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 25px;
}

/* ===== CARD ===== */
.card {
  background: #1A1A1A;
  padding: 22px;
  border-radius: 12px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.card h3 {
  color: #E50914;
  font-size: 14px;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card p {
  font-size: 26px;
  font-weight: bold;
  margin: 0;
}

/* ================= RESPONSIVE ================= */

/* Tablet */
@media (max-width: 992px) {
  .cards {
    gap: 18px;
  }

  .card p {
    font-size: 24px;
  }
}

/* Mobile */
@media (max-width: 768px) {
  .cards {
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .card {
    padding: 18px;
  }

  .card h3 {
    font-size: 13px;
  }

  .card p {
    font-size: 22px;
  }
}

/* Small Mobile */
@media (max-width: 480px) {
  .cards {
    grid-template-columns: 1fr; /* single column */
  }

  .card {
    padding: 16px;
  }

  .card p {
    font-size: 20px;
  }
}

</style>

{% endblock %}
