{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secure Payment | Film Frame Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
/* ================= THEME ================= */
:root {
  --white: #ffffff;
  --sky-soft: #f2f9ff;
  --sky-light: #e6f3ff;

  --fire-red: #e50914;
  --success-green: #22c55e;
  --gold: #d4af37;

  --dark-text: #111111;
  --soft-gray: #666666;

  --border-light: rgba(0,0,0,0.12);
  --card-shadow: 0 18px 40px rgba(0,0,0,0.1);
}

/* ================= BODY ================= */
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    180deg,
    var(--white) 0%,
    var(--sky-soft) 55%,
    var(--sky-light) 100%
  );
  font-family: "Segoe UI", sans-serif;
  color: var(--dark-text);
}

/* ================= PAYMENT CARD ================= */
.payment-card {
  width: 100%;
  max-width: 420px;
  background: var(--white);
  padding: 32px;
  border-radius: 22px;
  box-shadow: var(--card-shadow);
  text-align: center;
  border: 1px solid var(--border-light);
  animation: fadeUp 0.6s ease;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ================= LOGO ================= */
.logo {
  margin-bottom: 14px;
}

.logo img {
  width: 140px;
}

/* ================= TEXT ================= */
.title {
  font-size: 22px;
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--fire-red);
}

.subtitle {
  font-size: 13px;
  color: var(--soft-gray);
  margin-bottom: 26px;
}

/* ================= AMOUNT BOX ================= */
.amount-box {
  background: linear-gradient(
    135deg,
    var(--sky-soft),
    var(--white)
  );
  border: 1px dashed var(--gold);
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 26px;
}

.amount-box span {
  font-size: 13px;
  color: var(--soft-gray);
}

.amount {
  font-size: 32px;
  font-weight: 700;
  color: var(--fire-red);
  margin-top: 4px;
}

/* ================= PAY BUTTON ================= */
.pay-btn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  color: #ffffff;
  background: linear-gradient(
    135deg,
    var(--fire-red),
    #b20710
  );
  box-shadow: 0 0 18px rgba(229, 9, 20, 0.45);
  transition: all 0.3s ease;
}

.pay-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 28px rgba(229, 9, 20, 0.65);
}

/* ================= SECURE TEXT ================= */
.secure {
  margin-top: 14px;
  font-size: 12px;
  color: var(--soft-gray);
}

.secure span {
  color: var(--success-green);
  font-weight: 600;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 480px) {
  .payment-card {
    margin: 0 14px;
    padding: 26px;
  }

  .amount {
    font-size: 28px;
  }
}

  </style>
</head>

<body>

  <div class="payment-card">

    <!-- LOGO -->
    <div class="logo">
      <img src="{% static 'img/company_logo.png' %}" alt="Film Frame Fashion">
    </div>

    <h2 class="title">Secure Payment</h2>
    <p class="subtitle">Complete your purchase safely</p>

    <!-- AMOUNT -->
    <div class="amount-box">
      <span>Total Payable</span>
      <div class="amount">₹{{ final_amount }}</div>
    </div>

    <!-- PAY BUTTON -->
    <button id="pay-btn" class="pay-btn">
      Pay Now with Razorpay
    </button>

    <div class="secure">
      🔒 <span>100% Secure</span> • Powered by Razorpay
    </div>

  </div>

  <!-- ================= RAZORPAY SCRIPT ================= -->
  <script>
    var options = {
      "key": "{{ razorpay_key }}",
      "amount": "{{ amount }}",
      "currency": "INR",
      "name": "Film Frame Fashion",
      "description": "Order Payment",
      "order_id": "{{ order_id }}",
      "handler": function (response) {
        window.location.href =
          "/payment-success/?" +
          "payment_id=" + response.razorpay_payment_id +
          "&order_id=" + response.razorpay_order_id +
          "&signature=" + response.razorpay_signature;
      },
      "theme": {
        "color": "#E50914"
      }
    };

    var rzp = new Razorpay(options);

    document.getElementById('pay-btn').onclick = function (e) {
      rzp.open();
      e.preventDefault();
    };
  </script>

</body>
</html>
